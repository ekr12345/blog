---
layout: home
title: Home
---

<!-- Screen 1: boot logo (plays once, then the whole screen clears) -->
<section class="boot" id="boot" aria-hidden="true">
  <img id="boot-logo" class="boot-logo" src="/images/eric-logo.gif?v=3" data-still="/images/eric-logo.png"
       width="1024" height="296" alt="">
</section>

<!-- Screen 2: select menu -->
<main class="select" id="select">
  <h1 class="visually-hidden">Eric Roberts</h1>
  <nav aria-label="Main">
    <ul class="select-list" id="select-list">
      <li><a href="/posts">POSTS</a></li>
      <li><a href="/apps">APPS</a></li>
      <li><a href="/me">ME</a></li>
      <li><a href="/now">NOW</a></li>
    </ul>
  </nav>
</main>

<script>
(() => {
  const ANIM_MS = 2420;  // Sonic's two runs, until the logo settles
  const HOLD_MS = 900;   // logo stays on screen, like a real boot screen
  const FADE_MS = 450;   // matches the CSS fade

  const boot = document.getElementById('boot');
  const logo = document.getElementById('boot-logo');
  const select = document.getElementById('select');
  const items = [...document.querySelectorAll('#select-list a')];
  let current = 0;
  let done = false;

  // --- menu cursor -------------------------------------------------------
  const focusItem = (i) => {
    current = (i + items.length) % items.length;
    items.forEach((a, n) => a.classList.toggle('is-selected', n === current));
    items[current].focus({ preventScroll: true });
  };
  items.forEach((a, n) => {
    a.addEventListener('mouseenter', () => focusItem(n));
    a.addEventListener('focus', () => {
      current = n;
      items.forEach((b, m) => b.classList.toggle('is-selected', m === n));
    });
  });
  document.addEventListener('keydown', (e) => {
    if (!done) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); focusItem(current + 1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); focusItem(current - 1); }
  });

  // --- boot sequence -----------------------------------------------------
  const showMenu = (instant) => {
    if (done) return;
    done = true;
    try { sessionStorage.setItem('booted', '1'); } catch (_) {}
    if (instant) {
      boot.hidden = true;
    } else {
      boot.classList.add('is-gone');
      setTimeout(() => { boot.hidden = true; }, FADE_MS);
    }
    setTimeout(() => {
      select.classList.add('is-shown');
      focusItem(0);
    }, instant ? 0 : FADE_MS);
  };

  let seen = false;
  try { seen = sessionStorage.getItem('booted') === '1'; } catch (_) {}
  if (new URLSearchParams(location.search).has('intro')) seen = false; // ?intro replays it
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (seen || reduced) { showMenu(true); return; }

  // Any key, click or tap skips the intro, like pressing Start.
  const skip = () => showMenu(false);
  boot.addEventListener('click', skip);
  document.addEventListener('keydown', function onKey() {
    document.removeEventListener('keydown', onKey);
    skip();
  });

  const run = () => setTimeout(() => {
    logo.src = logo.dataset.still;          // stop on the clean logo
    setTimeout(skip, HOLD_MS);              // then clear the screen
  }, ANIM_MS);
  if (logo.complete) run(); else logo.addEventListener('load', run, { once: true });
})();
</script>
